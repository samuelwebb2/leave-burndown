[project]
name = "leave-burndown"
version = "0.1.0"
description = "Annual leave burn-down chart and planner"
readme = "README.md"
authors = [
    { name = "sammy", email = "samuelwebb2@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.0",
    "pydantic>=2.10",
]

[project.scripts]
leave-burndown = "leave_burndown:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "djlint>=1.46.1",
    "pytest>=8",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.rules]
all = "error"

[tool.ruff.lint]
# The defaults plus: isort, bugbear, pyupgrade, simplify, comprehensions, ruff's own
# rules, unused arguments, return simplification, timezone-aware dates, and
# annotations on every function.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PIE", "RET", "ARG", "ANN", "TC", "DTZ"]

[tool.ruff.lint.flake8-type-checking]
# pydantic reads annotations at runtime, so what they name must be a real import.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.djlint]
profile = "jinja"
indent = 2
